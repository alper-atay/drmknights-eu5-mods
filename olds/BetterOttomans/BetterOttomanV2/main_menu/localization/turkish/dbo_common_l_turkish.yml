l_turkish:
 dbo_destiny_talented_youngest_heir_selection: "En Genç ve Tam Yetenek Esası"
 dbo_destiny_talented_youngest_heir_selection_desc: "Kıdem maziye hürmettir, liyakat ise istikbale hükmetmektir; bu sebeple devletin bekâsı, hanedanın en yaşlısı yerine kılıcı en keskin, zihni en berrak ve enerjisi en yüksek olan en genç şehzadenin iradesine emanet edilmelidir. Gençlik, işlenmeyi bekleyen en kıymetli cevher; liyakat ise cihan hâkimiyeti ülkümüzün yegâne anahtarıdır. İhtiyar heyetlerin sükûneti yerine genç fatihlerin sarsılmaz azminin esas alındığı bu nizam, devletin asırlar boyu sürecek olan ihtişamının en büyük teminatı olacaktır."
 dbo_crown_noble_marry: "Hanımefendiyle Evlendir"
 dbo_crown_noble_marry_concept: "[marriage|E]"
 dbo_crown_noble_marry_act: "$dbo_crown_noble_marry$"
 dbo_crown_noble_marry_desc_specific: "[SCOPE.sCharacter('recipient').GetName], yerel bir hanımefendiyle evlenecek."
 dbo_crown_noble_marry_desc: "[character|e], yerel bir hanımefendiyle evlenecek."
