l_turkish:
 STATIC_MODIFIER_NAME_dbo_country_modifier_interregnum: "Fetret Devri"
 STATIC_MODIFIER_DESC_dbo_country_modifier_interregnum: "Fetret Devri, Devlet-i Aliyye'nin merkezi otoritesinin zayıfladığı, taht kavgalarının ve iç karışıklıkların hüküm sürdüğü karanlık dönem."
 STATIC_MODIFIER_NAME_dbo_country_modifier_interregnum_recovery: "Fetret Devri Sonrası Toparlanma Dönemi"
 STATIC_MODIFIER_DESC_dbo_country_modifier_interregnum_recovery: "Fetret Devri'nin sona ermesiyle birlikte devletin yeniden birliğini sağladığı, merkezi otoritenin güçlendiği ve kaybedilen gücün geri kazanıldığı toparlanma süreci."
 STATIC_MODIFIER_NAME_dbo_location_modifier_miracle: "Devlet-i Aliyye Mucizesi"
 STATIC_MODIFIER_DESC_dbo_location_modifier_miracle: "[GetCountry('TUR').GetName] kuruluş dönemindeki hızlı büyümesini, sağlam idari yapısını ve askeri dehasını temsil eden, küçük bir uç beyliğinden cihan devletina dönüşmesini sağlayan eşsiz dinamizm. [ShowModifier('dbo_location_modifier_miracle')] bu topraklarda."
 STATIC_MODIFIER_NAME_dbo_country_modifier_golden_age_of_science: "Bilimin Altın Çağ"
 STATIC_MODIFIER_DESC_dbo_country_modifier_golden_age_of_science: "Barutun yaygınlaşmasıyla silah teknolojisinde devrimler yaşanırken, tıp, astronomi, matematik ve diğer bilimlerde büyük ilerlemelerin kaydedildiği, Devlet-i Aliyye'nin bilimsel ve teknolojik gelişmelerle zirveye ulaştığı dönem."
 STATIC_MODIFIER_NAME_dbo_country_modifier_centralization_politics: "Merkeziyetçi Politikalar"
 STATIC_MODIFIER_DESC_dbo_country_modifier_centralization_politics: "Devletin merkezi otoritenin güçlendirilmesi ve idari birliğin sağlanmasıyla ilgili politikalar ve uygulamalar."
 STATIC_MODIFIER_NAME_dbo_country_modifier_wisdom_from_the_east: "Doğu'dan Gelen Bilgelik"
 STATIC_MODIFIER_DESC_dbo_country_modifier_wisdom_from_the_east: "Doğu'nun zengin kültürel ve entelektüel mirasından beslenerek, bu bilgeliği devlet yönetimi, bilim, sanat ve kültürde kullanarak büyük bir medeniyet inşa etme vizyonu."
 STATIC_MODIFIER_NAME_dbo_character_modifier_retired: "Emekli"
 STATIC_MODIFIER_DESC_dbo_character_modifier_retired: "Bu karakter artık aktif olarak görev yapmıyor ve emekli olmuş durumda."