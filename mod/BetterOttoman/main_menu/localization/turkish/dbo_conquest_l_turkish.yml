 dbo_conquest_slogan_rumelia: "İki Kıta, Tek Devlet"
 dbo_conquest_slogan_fertile_crescent: "Medeniyetin Kalbi"
 dbo_conquest_slogan_arabian_peninsula: "Kutsal Toprakların Muhafızı"
