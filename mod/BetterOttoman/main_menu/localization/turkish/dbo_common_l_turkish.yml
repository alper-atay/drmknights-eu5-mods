l_turkish:
 dbo_destiny_talented_youngest_heir_selection: "En Genç ve Tam Yetenek Esası"
 dbo_destiny_talented_youngest_heir_selection_desc: "Kıdem maziye hürmettir, liyakat ise istikbale hükmetmektir; bu sebeple devletin bekâsı, hanedanın en yaşlısı yerine kılıcı en keskin, zihni en berrak ve enerjisi en yüksek olan en genç şehzadenin iradesine emanet edilmelidir. Gençlik, işlenmeyi bekleyen en kıymetli cevher; liyakat ise cihan hâkimiyeti ülkümüzün yegâne anahtarıdır. İhtiyar heyetlerin sükûneti yerine genç fatihlerin sarsılmaz azminin esas alındığı bu nizam, devletin asırlar boyu sürecek olan ihtişamının en büyük teminatı olacaktır."
 dbo_crown_noble_marry: "Hanımefendiyle Evlendir"
 dbo_crown_noble_marry_concept: "[marriage|E]"
 dbo_crown_noble_marry_act: "$dbo_crown_noble_marry$"
 dbo_crown_noble_marry_desc_specific: "[SCOPE.sCharacter('recipient').GetName], yerel bir hanımefendiyle evlenecek."
 dbo_crown_noble_marry_desc: "[character|e], yerel bir hanımefendiyle evlenecek."
 dbo_crown_noble_marry_past: "[SCOPE.sCharacter('recipient').GetName] [SCOPE.sCharacter('recipient').GetHerselfHimself] evlendi!"
 dbo_crown_noble_marry_act_past: "[SCOPE.sCharacter('recipient').GetName], yerel bir hanımefendiyle evlendi!"
 dbo_crown_noble_marry_tt: "Bu karakter, yerel bir hanımefendiyle evlenecek."
 dbo_legal_code_kanunname_i_al_i_osman_policy: "Kanunname-i Âl-i Osman"
 dbo_legal_code_kanunname_i_al_i_osman_policy_desc: "Fatih Sultan Mehmed Han tarafından tedvin edilen bu kanunname, devletin bekâsı ve nizam-ı âlem için örfi hukuku yazılı hale getiren muazzam bir hukuk abidesidir. 'Kardeş Katli' meselesinden teşrifat usullerine, devlet görevlilerinin yetkilerinden ceza hukukuna kadar geniş bir yelpazeyi kapsayan bu yasalar, Devlet-i Aliyye'nin devlet yapısını merkeziyetçi bir mutlakiyet temeline oturtmuştur. Bu kanunlar, devletin sadece kılıçla değil, aynı zamanda sarsılmaz bir adalet ve nizam anlayışıyla yönetilmesini sağlayarak asırlar sürecek olan idari istikrarın kapılarını aralamıştır."
 dbo_legal_code_kanunname_i_al_i_osman_policy_developed: "$dbo_legal_code_kanunname_i_al_i_osman_policy$ geliştirildi"
 dbo_legal_code_kanunname_i_al_i_osman_policy_developed_tt: "Kanûnî Sultan Süleyman, devletin idari ve hukuki yapısını mükemmelleştirdi!"