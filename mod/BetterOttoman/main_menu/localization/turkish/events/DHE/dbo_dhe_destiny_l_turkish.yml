 # dbo_destiny_devshirme_system
 dbo_destiny_devshirme_system_can_end_tt: "[ShowModifier('dbo_country_modifier_centralization_politics')];\n[ShowTriggerConditionsForScope('dbo_destiny_devshirme_system_check', SituationView.GetPlayer.MakeScope.Self)]"
 dbo_dhe_destiny.102.title: "[ShowLawName('recruitment_law')]\n[Concept('law', 'Kanunu')|e]"
 dbo_dhe_destiny.102.desc: "Devlet-i Aliyye'nin insan gücü ve bürokrasi yönetiminin temel taşıdır. Balkanlar ve Anadolu'daki gayrimüslim tebaanın yetenekli çocuklarının seçilerek devlet hizmetine alınması esasına dayanır. Sıkı bir eğitimden geçen bu gençler; askerlik yeteneklerine göre Yeniçeri Ocağı'na, idari zekalarına göre ise Enderun Mektebi'ne gönderilerek devletin en üst düzey yönetici kadrolarını oluştururlar. Bu sistem, hanedana sadık, toprak sahibi soylulardan bağımsız bir yönetici sınıfı yaratarak merkezi otoriteyi güçlendirir."
 dbo_dhe_destiny.102.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
# Winner Ottoman get all Beyliks
 dbo_dhe_destiny.103.title: "[ShowSituationName('rise_of_the_ottomans')]\n Zaferimizle Sonuçlandı"
 dbo_dhe_destiny.103.desc: "Konstantiniyye’nin fethiyle çağ açan devletimiz, Rumeli’nin ardından Anadolu’nun geri kalanı üzerinde de mutlak ve ebedi hâkimiyetini ilan ediyor.\nArtık beylikler arası rekabet dönemi tarihin tozlu sayfalarına karışmış, geride kalan tüm sancaklar merkezi otoritemizin sarsılmaz birer parçası olarak safımıza katılmıştır.\nBir zamanların müstakil beylikleri artık payitahtın eyaletleri olarak gücümüze güç katarken, Anadolu’da tek bir aykırı sesin dahi kalmadığı bu mutlak bütünleşme süreci tamamlanıyor.\nDoğudan batıya uzanan bu devasa coğrafya tek bir mühürle mühürlenirken, sancağımızın gölgesi kıtaları aşan bir dünya devletinun doğuşunu tüm cihana haykırıyor.\nGücümüz birleşti, irademiz tek bir merkezde toplandı; artık hiçbir kuvvet bu görkemli yükselişin önünde duramayacaktır."
 dbo_dhe_destiny.103.a: "Tüm Anadolu Beylikleri sancağımız altında birleştir!"
 dbo_dhe_destiny.103.b: "Hayır onları savaş meydanlarında topraklarımıza katacağız!"
# dbo_destiny_culus_payment
 dbo_dhe_destiny.104.title: "Cülûs Bahşişi"
 dbo_dhe_destiny.104.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] yeni [Concept('ruler', 'Hükümdar')|e] olarak tahta çıktı ve Cülûs Bahşişi için asker ve idari [pops] Bâbüssaâde önünde toplanmaya başladı. Bu ödeme, sadece bir gelenek değil, aynı zamanda yeni [Concept('ruler', 'Hükümdarın')|e] gücünü ve devletin refahını simgeleyen önemli bir törendir. Cülûs ödemesini yaparak, yeni [Concept('ruler', 'Hükümdarın')|e] tahta çıkışını kutlayabilir ve halkın desteğini kazanabilirsiniz. Ancak bu ödeme, devlet hazinesine büyük bir yük getirebilir ve diğer önemli harcamaları kısıtlayabilir. Bu nedenle, cülûs ödemesini yapıp yapmamak konusunda dikkatli bir değerlendirme yapmanız gerekmektedir. Yapmamız durumunda askeri ve idari personel arasında ciddi memnuniyetsizlik oluşabilir, yapmazsak da halkın gözünde yeni [Concept('ruler', 'Hükümdarın')|e] meşruiyeti zedelenebilir. Bu kararı verirken, devletin mevcut mali durumunu, halkın beklentilerini ve uzun vadeli etkilerini göz önünde bulundurmanız önemlidir."
 dbo_dhe_destiny.104.a: "Cülus ödemesini yapalım!"
 dbo_dhe_destiny.104.b: "Cülus ödemesini yapmayalım!"
 dbo_destiny_culus_payment_rejected_soldier_pops_lose_satisfaction_tt: "Cülûs Bahşişi ödemesi yapmama kararı, [ShowPopTypeName('soldiers')] [Concept('pop_type', 'Toplum Türüne')|e] ait her [pops] arasında [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] [pop_satisfaction|e] kaybına neden olur"
