 dbo_dhe_sultans_fatih_sultan_mehmed.1.title: "[GetCharacter('dbo_fatih_sultan_mehmed').GetName]\n$dbo_history_common_born$"
 dbo_dhe_sultans_fatih_sultan_mehmed.1.desc: "Devlet-i Aliyye'nin gelecekteki [Concept('ruler', 'Hükümdarı')|e] [GetCharacter('dbo_fatih_sultan_mehmed').GetName] dünyaya geldi."
 dbo_dhe_sultans_fatih_sultan_mehmed.1.a: "Bir Fatih Doğdu!"
