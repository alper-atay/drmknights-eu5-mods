 dbo_dhe_sultans_fatih_sultan_mehmed.2.title: "[GetCharacter('dbo_fatih_sultan_mehmed').GetName]\n$dbo_history_common_rise$"
 dbo_dhe_sultans_fatih_sultan_mehmed.2.desc: "[GetCharacter('dbo_fatih_sultan_mehmed').GetName], [GetCharacter('dbo_fatih_sultan_mehmed').GetAgeInYears] yaşına geldi ve Devlet-i Aliyye'nin başına geçecektir!"
 dbo_dhe_sultans_fatih_sultan_mehmed.2.a: "$dbo_history_common_rise_option$"
