 # Interregnum
 # Interregnum Begin
 dbo_dhe_sultans_yildirim_sultan_bayezid.21.title: "Fetret Devri"    
 dbo_dhe_sultans_yildirim_sultan_bayezid.21.desc: "[GetCharacter('dbo_yildirim_sultan_bayezid').GetName] ölümünün ardından, Devlet-i Aliyye İmparatorluğu karanlık bir döneme girmiştir. Oğulları arasında taht kavgası başlamış, devlet içinde kaos ve belirsizlik hüküm sürmüştür. Bu on bir yıllık dönem, Devlet-i Aliyye tarihinin en kritik dönemidir."
 dbo_dhe_sultans_yildirim_sultan_bayezid.21.a: "Devlet-i Aliyye yeniden toparlanacak!"
 dbo_history_ottoman_interregnum_tt: "Tüm [rebel|e] [pops|e] [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [pop_satisfaction|e] kaybeder."
 dbo_history_ottoman_interregnum_rebel_progress_gain_tt: "Tüm [rebels|e] [ShowNamedValue('rebel_progress_severe_penalty')|-=2%] ilerler."
# Interregnum End
 dbo_dhe_sultans_yildirim_sultan_bayezid.22.title: "Fetret Devri Sona Erdi"
 dbo_dhe_sultans_yildirim_sultan_bayezid.22.desc: "On bir yıl süren kaos, kardeş kavgası ve belirsizliğin ardından, [GetCountry('TUR').GetGovernment.GetRuler.GetName] rakiplerini bertaraf ederek Devlet-i Aliyye tahtına tek başına sahip oldu. Devlet-i Aliyye, parçalanmanın eşiğinden dönerek yeniden birleşti ve sarsılan otorite yeniden tesis edildi."
 dbo_dhe_sultans_yildirim_sultan_bayezid.22.a: "Devlet-i Aliyye yeniden tek vücut!"
 dbo_history_ottoman_interregnum_end_tt: "Tüm [pops|e] [ShowNamedValue('pop_satisfaction_severe_bonus')|+=2%] [pop_satisfaction|e] kazanır."
 dbo_history_ottoman_interregnum_end_rebel_progress_lose_tt: "Tüm [rebels|e] yarı yarıya ilerleme kaybeder."
# dbo_fatih_sultan_mehmed
 dbo_fatih_sultan_mehmed_historical_info_common: "[GetCharacter('dbo_fatih_sultan_mehmed').GetName], sadece bir fatih değil, aynı zamanda Doğu ve Batı kültürlerini şahsında birleştiren entelektüel bir deha ve modern Devlet-i Aliyye İmparatorluğu'nun gerçek kurucusudur. 1453 yılında, henüz 21 yaşındayken 'aşılmaz' denilen Bizans surlarını devasa şahi toplarıyla yerle bir ederek İstanbul'u fethetmiş, bir çağı kapatıp yeni bir çağı açmıştır. Kendisini 'Kayser-i Rum' (Roma İmparatoru) ilan ederek Roma'nın mirasına sahip çıkmış, devlet teşkilatını Kanunname-i Âl-i Osman ile hukuki bir temele oturtmuştur. Karadeniz'i bir Türk gölü haline getiren, Balkanlar'da Devlet-i Aliyye hakimiyetini perçinleyen ve Otranto seferiyle Roma'nın kapılarına dayanan Fatih, askeri başarılarının yanı sıra bilim, sanat ve felsefeye verdiği önemle imparatorluğu bir kültür merkezi haline getirmiştir."
 dbo_fatih_sultan_mehmed_and_orban_tt: "[GetCharacter('dbo_fatih_sultan_mehmed').GetName]'in vizyonu ve Macar usta Orban'ın teknik dehası birleşerek, İstanbul'un surlarını yıkacak olan devasa 'Şahi' toplarının dökülmesini sağlamıştır. Bu teknolojik devrim, sadece bir şehrin fethini değil, dünya askeri tarihinde yeni bir çağın başlangıcını simgeler. Olay zincirini tetikler!"
# dbo_fatih_sultan_mehmed born
 dbo_dhe_sultans_fatih_sultan_mehmed.1.title: "[GetCharacter('dbo_fatih_sultan_mehmed').GetName]'in Doğumu"
 dbo_dhe_sultans_fatih_sultan_mehmed.1.desc: "[GetCharacter('dbo_fatih_sultan_mehmed').GetBirthDate] yılında, Devlet-i Aliyye İmparatorluğu'nun gelecekteki padişahı [GetCharacter('dbo_fatih_sultan_mehmed').GetName] dünyaya geldi. Babası [GetCharacter('dbo_fatih_sultan_mehmed').GetFather.GetName] izinden giderek, genç yaşta Devlet-i Aliyye'nin başına geçecektir!"
 dbo_dhe_sultans_fatih_sultan_mehmed.1.a: "Bir Fatih Doğdu!"
# dbo_fatih_sultan_mehmed rise
 dbo_dhe_sultans_fatih_sultan_mehmed.2.title: "[GetCharacter('dbo_fatih_sultan_mehmed').GetName]'in Yükselişi"
 dbo_dhe_sultans_fatih_sultan_mehmed.2.desc: "[GetCharacter('dbo_fatih_sultan_mehmed').GetName], [GetCharacter('dbo_fatih_sultan_mehmed').GetAgeInYears] yaşına geldi ve artık Devlet-i Aliyye'nin başına geçecektir! Hiç bir güç engelleyemez."
 dbo_dhe_sultans_fatih_sultan_mehmed.2.a: "$dbo_history_common_rise_option$"
# dbo_fatih_sultan_mehmed ascend
 dbo_dhe_sultans_fatih_sultan_mehmed.3.title: "[GetCharacter('dbo_fatih_sultan_mehmed').GetName]'in\n$dbo_history_common_ascend$"
 dbo_dhe_sultans_fatih_sultan_mehmed.3.desc: "[GetCharacter('dbo_fatih_sultan_mehmed').GetName], [GetCharacter('dbo_fatih_sultan_mehmed').GetAgeInYears] yaşına geldi ve artık Devlet-i Aliyye'nin başına geçecektir! Hiç bir güç engelleyemez."
 dbo_dhe_sultans_fatih_sultan_mehmed.3.a: "$dbo_history_common_ascend_option$"
# dbo_history_fatih_sultan_mehmet_and_orban_events_completed
 dbo_history_fatih_sultan_mehmet_and_orban_events_completed: "[GetCharacter('dbo_fatih_sultan_mehmed').GetName] ve Macar Usta Orban ile tarihin o güne kadar görmediği en büyük topları döktüler"
 dbo_dhe_sultans_fatih_sultan_mehmed.11.title: "Fatih Sultan Mehmed ve Usta Orban"
 dbo_dhe_sultans_fatih_sultan_mehmed.11.desc: "İstanbul'un aşılmaz surlarını yıkma hayaliyle yanıp tutuşan genç Sultan Mehmed, Macar döküm ustası Orban'ı huzuruna kabul etti. Orban'ın teknik dehası ile Sultan'ın vizyonu birleşince, tarihin o güne dek gördüğü en büyük kuşatma silahı olan 'Şahi' toplarının döküm süreci başladı. Bu devasa toplar, sadece birer silah değil, bir çağın kapanıp yenisinin açılacağının habercisiydi."
 dbo_dhe_sultans_fatih_sultan_mehmed.11.a: "Demek mümkün..."
 dbo_dhe_sultans_fatih_sultan_mehmed.12.title: "[GetCharacter('dbo_fatih_sultan_mehmed').GetName] Dökümhane'de"
 dbo_dhe_sultans_fatih_sultan_mehmed.12.desc: "[GetCharacter('dbo_fatih_sultan_mehmed').GetName], Edirne'deki dökümhanenin kor ateşleri arasında bizzat bulunarak çalışmaları denetliyor. Macar Usta Orban ile birlikte, İstanbul'un kadim surlarını tozla buz edecek o devasa topların çatlamadan dökülebilmesi için en dayanıklı metal alaşımlarını ve döküm tekniklerini titizlikle araştırıyorlar. Her bir gülle, sadece bir şehri değil, bir devletin kaderini belirleyecek."
 dbo_dhe_sultans_fatih_sultan_mehmed.13.title: "Şahi'nin İlk Nefesi: Kalıba Dökülüş"
 dbo_dhe_sultans_fatih_sultan_mehmed.13.desc: "Edirne dökümhanesinde nefesler tutuldu; erimiş bronz, devasa kalıplara doğru kızıl bir nehir gibi akmaya başladı.[GetCharacter('dbo_fatih_sultan_mehmed').GetName]'in gözleri önünde, tarihin en büyük topu olan Şahi ilk kez formunu alıyor. Bu kor ateşten çıkan dev, Bizans'ın bin yıllık surlarına meydan okuyacak olan sarsılmaz iradenin somut bir tezahürüdür."
# dbo_history_fatih_sultan_mehmed_topkapi_palace
 dbo_dhe_sultans_fatih_sultan_mehmed.21.title: "[ShowBuildingTypeName('dbo_topkapi_palace')]"
 dbo_dhe_sultans_fatih_sultan_mehmed.21.desc: "[GetCharacter('dbo_fatih_sultan_mehmed').GetName], İstanbul'un fethinden sonra, şehrin yeni başkenti olarak seçilen [ShowBuildingTypeName('dbo_topkapi_palace')] inşa ettirdi. Bu saray, sadece bir hükümet merkezi değil, devletin kalbi olarak, Devlet-i Aliyye'nın siyasi gücünü temsil eder."
 dbo_dhe_sultans_fatih_sultan_mehmed.21.a: "İnşaat Başlasın!"
# dbo_history_fatih_sultan_mehmed_sahni_seman_madrasa
 dbo_dhe_sultans_fatih_sultan_mehmed.22.title: "[ShowBuildingTypeName('dbo_sahni_seman_madrasa')]"
 dbo_dhe_sultans_fatih_sultan_mehmed.22.desc: "[GetCharacter('dbo_fatih_sultan_mehmed').GetName], İstanbul'un fethinden sonra, şehrin kültürel ve dini hayatını canlandırmak amacıyla [ShowBuildingTypeName('dbo_sahni_seman_madrasa')] [Concept('building', 'Yapısını')|e] inşa ettirdi. Bu medrese, sadece bir eğitim kurumu değil, aynı zamanda Devlet-i Aliyye'nın yeni başkentinde İslam bilginlerinin yetiştiği bir kültür merkezi haline geldi. Fatih, bu yapıyla İstanbul'u sadece askeri bir güç değil, aynı zamanda entelektüel bir merkez haline getirme vizyonunu somutlaştırmıştır. Medrese, klasik İslam mimarisinin zarif örneklerinden biri olarak, Devlet-i Aliyye'nın kültürel zenginliğini ve eğitim konusundaki kararlılığını simgeler. Bugün hala ayakta duran Sahni Seman Medresesi, Fatih Sultan Mehmed'in sadece bir fatih değil, aynı zamanda bir kültür ve eğitim hamisi olduğunu gösteren önemli bir miras olarak varlığını sürdürmektedir."
 dbo_dhe_sultans_fatih_sultan_mehmed.22.a: "İnşaat Başlasın!"
# dbo_fatih_sultan_mehmed Legal Code Kanunname-i Âl-i Osman
 dbo_dhe_sultans_fatih_sultan_mehmed.23.title: "[ShowPolicyName('dbo_destiny_legal_code_kanunname_i_al_i_osman_policy')]\n[Concept('policy', 'Politikası')|e]"
 dbo_dhe_sultans_fatih_sultan_mehmed.23.desc: "[GetCharacter('dbo_fatih_sultan_mehmed').GetName], devletin bekası ve merkezi otoritenin güçlendirilmesi amacıyla Devlet-i Aliyye hukuk sistemini sistematik bir yapıya kavuşturan [ShowPolicyName('dbo_destiny_legal_code_kanunname_i_al_i_osman_policy')] [Concept('policy', 'Politikası')|e] yürürlüğe koydu. Bu kanunname ile devlet teşkilatı, protokol kuralları ve veraset sistemi hukuki bir zemine oturtuldu."
 dbo_dhe_sultans_fatih_sultan_mehmed.23.a: "Devletin Temeli Sağlamlaşıyor!"
# dbo_history_fatih_sultan_mehmed_retire
 dbo_dhe_sultans_fatih_sultan_mehmed.31.title: "[GetCharacter('dbo_fatih_sultan_mehmed').GetName]\nEmeklilik Kararı"
 dbo_dhe_sultans_fatih_sultan_mehmed.31.desc: "Fatih Sultan Mehmed, uzun ve başarılı bir saltanatın ardından, devlet işlerini genç ve enerjik bir varise devretmeye karar verdi. Emeklilik kararı, Devlet-i Aliyye tarihinde nadir görülen bir durumdur ve onun vizyoner liderliğinin bir göstergesidir."
 dbo_dhe_sultans_fatih_sultan_mehmed.31.a: "Emeklilik Hayatı Başlasın!"
 dbo_dhe_sultans_fatih_sultan_mehmed.31.b: "Hayır Hükmetmeye Devam Etmeliyim!"
# dbo_fatih_sultan_mehmed Die
 dbo_dhe_sultans_fatih_sultan_mehmed.32.title: "[GetCharacter('dbo_fatih_sultan_mehmed').GetName]'in Vefatı"
 dbo_dhe_sultans_fatih_sultan_mehmed.32.desc: "'Ebu'l-Feth' (Fetihlerin Babası) [GetCharacter('dbo_fatih_sultan_mehmed').GetName] hayata gözlerini yumdu. Ölümü, hem Doğu'da hem Batı'da büyük bir yankı uyandırdı."
 dbo_dhe_sultans_fatih_sultan_mehmed.32.a: "$dbo_history_common_die_option$"
# dbo_yavuz_sultan_selim
 dbo_yavuz_sultan_selim_historical_info_common: "[GetCharacter('dbo_yavuz_sultan_selim').GetName], Devlet-i Aliyye İmparatorluğu'nun dokuzuncu padişahı ve ilk Devlet-i Aliyye halifesidir. 'Yavuz' lakabını sert mizacı, sarsılmaz iradesi ve askeri dehasıyla kazanan Selim Han, sekiz yıl gibi kısa bir sürede imparatorluk topraklarını iki buçuk katına çıkararak cihanşümul bir güç haline getirmiştir. Babası II. Bayezid'den devraldığı devleti, rotasını Doğu'ya çevirerek Safevi tehdidine karşı Çaldıran'da mutlak bir zaferle korumuş; ardından Mercidabık ve Ridaniye muharebeleriyle Memlük Devleti'ne son vererek Suriye, Filistin, Hicaz ve Mısır'ı Devlet-i Aliyye mülküne katmıştır. Kutsal toprakların anahtarlarını teslim aldığında kendisini 'Hâkimü'l-Haremeyn' (Kutsal Yerlerin Hakimi) yerine 'Hâdimü'l-Haremeyn' (Kutsal Yerlerin Hizmetkarı) olarak tanımlayan Yavuz, halifelik makamını Devlet-i Aliyye hanedanına taşıyarak İslam dünyasının liderliğini perçinlemiştir. Hazinesini ağzına kadar dolduran ve 'Benim altınla doldurduğum hazineyi, torunlarımdan her kim doldurabilirse kendi mührüyle mühürlesin, aksi halde benim mührümle mühürlenmeye devam etsin' vasiyetiyle Devlet-i Aliyye'nın ekonomik zirvesini simgeleyen Selim Han, kısa saltanatına asırları sığdıran bir hakan olarak tarihe geçmiştir."
# dbo_yavuz_sultan_selim Born
 dbo_dhe_sultans_yavuz_sultan_selim.1.title: "[GetCharacter('dbo_yavuz_sultan_selim').GetName]'in\n$dbo_history_common_born$"
 dbo_dhe_sultans_yavuz_sultan_selim.1.desc: "1470 yılında Amasya'da, Devlet-i Aliyye tarihinin en sert ve kararlı hükümdarlarından biri olacak olan Şehzade Selim dünyaya geldi. Babası II. Bayezid'in döneminde yetişen Selim, genç yaşlarından itibaren askeri yeteneği ve devlet yönetimine olan ilgisiyle dikkatleri üzerine çekti."
 dbo_dhe_sultans_yavuz_sultan_selim.1.a: "Yavuz Bir Aslan Doğdu!"
# dbo_yavuz_sultan_selim Ascend
 dbo_dhe_sultans_yavuz_sultan_selim.2.title: "[GetCharacter('dbo_yavuz_sultan_selim').GetName]'in Yükselişi"
 dbo_dhe_sultans_yavuz_sultan_selim.2.desc: "[GetCharacter('dbo_yavuz_sultan_selim').GetName] büyüyor ve devlet idaresindeki keskin zekası ile askeri dehası tüm Devlet-i Aliyye mülkünde yankılanmaya başlıyor. Şehzade Selim'in kararlılığı, dostun güveni düşmanın ise korkusu haline geliyor!"
 dbo_dhe_sultans_yavuz_sultan_selim.2.a: "$dbo_history_common_rise_option$"
# dbo_yavuz_sultan_selim Rise
 dbo_dhe_sultans_yavuz_sultan_selim.3.title: "[GetCharacter('dbo_yavuz_sultan_selim').GetName] Tahta Çıktı"
 dbo_dhe_sultans_yavuz_sultan_selim.3.desc: "1512 yılında, Yeniçerilerin tam desteğini alan [GetCharacter('dbo_yavuz_sultan_selim').GetName], babası II. Bayezid'in feragatiyle Devlet-i Aliyye tahtına oturdu. 'Yavuz' lakabıyla anılacak olan yeni padişah, devletin bekası için en sert kararları almaktan çekinmeyeceğini ve rotasını doğrudan Doğu'daki tehditlere çevireceğini tüm dünyaya ilan etti."
 dbo_dhe_sultans_yavuz_sultan_selim.3.a: "$dbo_history_common_ascend_option$"
# dbo_history_yavuz_sultan_selim_die
 dbo_dhe_sultans_yavuz_sultan_selim.11.title: "[GetCharacter('dbo_yavuz_sultan_selim').GetName]\n$dbo_history_common_die$"
 dbo_dhe_sultans_yavuz_sultan_selim.11.desc: "Sekiz yıla seksen yıllık iş sığdıran [GetCharacter('dbo_yavuz_sultan_selim').GetName], Batı'ya yapacağı büyük seferin hazırlıkları içindeyken 'Sirpençe' adı verilen bir çıban yüzünden hayata gözlerini yumdu."
 dbo_dhe_sultans_yavuz_sultan_selim.11.a: "$dbo_history_common_die_option$"
# dbo_kanuni_sultan_suleiman born
 dbo_dhe_sultans_kanuni_sultan_suleiman.1.title: "[GetCharacter('dbo_kanuni_sultan_suleiman').GetName]'in\n$dbo_history_common_born$"
 dbo_dhe_sultans_kanuni_sultan_suleiman.1.desc: "1494 yılında Trabzon'da, cihanın 'Muhteşem' olarak tanıyacağı, adaletiyle 'Kanuni' unvanını alacak olan Şehzade Süleyman dünyaya geldi. Babası [GetCharacter('dbo_yavuz_sultan_selim').GetName]'in sert ve disiplinli yönetiminde yetişen Süleyman, Devlet-i Aliyye'nın en parlak döneminin mimarı olacaktır."
 dbo_dhe_sultans_kanuni_sultan_suleiman.1.a: "Cihan'a Muhteşem Bir Yıldız Doğdu!"
# dbo_kanuni_sultan_suleiman rise
 dbo_dhe_sultans_kanuni_sultan_suleiman.2.title: "[GetCharacter('dbo_kanuni_sultan_suleiman').GetName]'in Yükselişi"
