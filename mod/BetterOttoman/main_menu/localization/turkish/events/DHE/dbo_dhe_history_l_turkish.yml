# dbo_history_yildirim_sultan_bayezid_defeated_by_timur
 dbo_dhe_sultans_yildirim_sultan_bayezid.11.title: "[GetCharacter('dbo_yildirim_sultan_bayezid').GetName]\nKâbusu"
 dbo_dhe_sultans_yildirim_sultan_bayezid.11.desc: "[GetCharacter('dbo_yildirim_sultan_bayezid').GetName], rüyasında Timur tarafından esir alınacağını görmüştü. Bu rüya, onun gelecekteki zorluklara karşı hazırlıklı olmasını sağladı."
 dbo_dhe_sultans_yildirim_sultan_bayezid.11.a: "Kâbuslar bazen gerçeğe dönüşür."
# dbo_history_yildirim_sultan_bayezid_nightmare
 dbo_dhe_sultans_yildirim_sultan_bayezid.12.title: "[GetCharacter('dbo_yildirim_sultan_bayezid').GetName]\nKâbusunu Yaşıyor"
 dbo_dhe_sultans_yildirim_sultan_bayezid.12.desc: "[GetCharacter('dbo_yildirim_sultan_bayezid').GetName], kâbusunda öleceğini görmüştü. Bu kâbus, onun gelecekteki zorluklara karşı hazırlıklı olmasını sağladı."
 dbo_dhe_sultans_yildirim_sultan_bayezid.12.a: "Kâbuslar bazen gerçeğe dönüşür."
# dbo_history_yildirim_sultan_bayezid_die
