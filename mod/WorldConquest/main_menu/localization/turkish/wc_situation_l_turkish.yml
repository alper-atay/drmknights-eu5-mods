l_turkish:
 wc_world_conquest: "Dünya Fethi"
 wc_world_conquest_desc: "Dünya Fethi, tüm dünyayı fethetmek için bir senaryodur. Bu senaryoda, oyuncuların amacı, tüm ülkeleri ele geçirerek dünya hakimiyetini sağlamaktır. Oyuncular, diplomasi, savaş ve strateji kullanarak diğer ülkeleri fethedebilir ve kendi imparatorluklarını kurabilirler."