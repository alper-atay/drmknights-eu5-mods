 # dbo_history_ottoman_interregnum_begin
 dbo_dhe_sultans_yildirim_sultan_bayezid.21.title: "Fetret Devri"
 dbo_dhe_sultans_yildirim_sultan_bayezid.21.desc: "[GetCharacter('dbo_yildirim_sultan_bayezid').GetName] ölümünün ardından, Devlet-i Aliyye karanlık bir döneme girmiştir. [Concept('heirs', 'Veliahtlar')|e] arasında taht kavgası başlamış, devlet içinde kaos ve belirsizlik hüküm sürmüştür. Bu on bir yıllık dönem, Devlet-i Aliyye tarihinin en kritik dönemidir."
 dbo_dhe_sultans_yildirim_sultan_bayezid.21.a: "Devlet-i Aliyye Toparlanacak!"
 dbo_history_ottoman_interregnum_tt: "Tüm [rebel|e] [pops|e] [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [pop_satisfaction|e] kaybeder."
 dbo_history_ottoman_interregnum_rebel_progress_gain_tt: "Tüm [rebels|e] [ShowNamedValue('rebel_progress_severe_penalty')|-=2%] ilerler."
# dbo_history_ottoman_interregnum_end
 dbo_dhe_sultans_yildirim_sultan_bayezid.22.title: "Fetret Devri Sona Erdi"
 dbo_dhe_sultans_yildirim_sultan_bayezid.22.desc: "On bir yıl süren kaos, kardeş kavgası ve belirsizliğin ardından, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] rakiplerini bertaraf ederek Devlet-i Aliyye tahtına tek başına sahip oldu. Devlet-i Aliyye, parçalanmanın eşiğinden dönerek yeniden birleşti ve sarsılan otorite yeniden tesis edildi."
 dbo_dhe_sultans_yildirim_sultan_bayezid.22.a: "Devlet-i Aliyye Tek Vücut!"
 dbo_history_ottoman_interregnum_end_tt: "Tüm [pops|e] [ShowNamedValue('pop_satisfaction_severe_bonus')|+=2%] [pop_satisfaction|e] kazanır."
 dbo_history_ottoman_interregnum_end_rebel_progress_lose_tt: "Tüm [rebels|e] yarı yarıya ilerleme kaybeder."