 dbo_dhe_sultans_yildirim_sultan_bayezid.11.title: "[GetCharacter('dbo_yildirim_sultan_bayezid').GetName]\nKâbusu"
 dbo_dhe_sultans_yildirim_sultan_bayezid.11.desc: "[GetCharacter('dbo_yildirim_sultan_bayezid').GetName], rüyasında Timur tarafından esir alınacağını görmüştü. Bu rüya, onun gelecekteki zorluklara karşı hazırlıklı olmasını sağladı."
 dbo_dhe_sultans_yildirim_sultan_bayezid.11.a: "Kâbuslar bazen gerçeğe dönüşür."
