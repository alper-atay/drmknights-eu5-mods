l_turkish:
 dbo_beylerbeyi: "Beylerbeyliği"
 dbo_beylerbeyi_desc: "Devlet-i Aliyye'de bir eyaletin veya bölgenin en yüksek yöneticisi olan Beylerbeyi, hem askeri hem de sivil otoriteye sahip önemli bir makamdır. Beylerbeyi, padişahın temsilcisi olarak görev yapar, bölgesel yönetimi sağlar ve gerektiğinde askeri liderlik yapar."
