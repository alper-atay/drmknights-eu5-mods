 STATIC_MODIFIER_NAME_dbo_location_modifier_miracle: "Devlet-i Aliyye Mucizesi"
 STATIC_MODIFIER_DESC_dbo_location_modifier_miracle: "[GetCountry('TUR').GetName] kuruluş dönemindeki hızlı büyümesini, sağlam idari yapısını ve askeri dehasını temsil eden, küçük bir uç beyliğinden cihan devletina dönüşmesini sağlayan eşsiz dinamizm. [ShowModifier('dbo_location_modifier_miracle')] bu topraklarda."